name: GitHub Actions Demo
on: [push]
jobs:
  Run-Tests:
    name: Run-Tests (jq ${{ matrix.jq }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jq: ['1.6', '1.7.1', '1.8.2']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git
          sudo ./bats-core/install.sh /usr/local
      - name: Install jq ${{ matrix.jq }}
        run: |
          asset=jq-linux-amd64
          [ "${{ matrix.jq }}" = 1.6 ] && asset=jq-linux64
          sudo curl -fsSL -o /usr/local/bin/jq "https://github.com/jqlang/jq/releases/download/jq-${{ matrix.jq }}/$asset"
          sudo chmod +x /usr/local/bin/jq
          jq --version
      - name: Run tests
        run: bats ${{ github.workspace }}/tests

  Run-Tests-Old-Bash:
    name: Run-Tests (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ['3.2', '4.3', '4.4']
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Build the test image
        run: docker build --build-arg BASH_VERSION=${{ matrix.bash }} -t mw-jwq-bash tests/docker
      - name: Run tests
        run: docker run --rm -v "${{ github.workspace }}":/w -w /w mw-jwq-bash bats tests

  Run-Tests-macOS:
    name: Run-Tests (macOS, bash 3.2)
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Install bats and jq
        run: brew install bats-core jq
      - name: Use the system bash (3.2)
        run: |
          mkdir "$RUNNER_TEMP/oldbash"
          ln -s /bin/bash "$RUNNER_TEMP/oldbash/bash"
          echo "$RUNNER_TEMP/oldbash" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          bash --version | head -1
          jq --version
          bats ${{ github.workspace }}/tests
